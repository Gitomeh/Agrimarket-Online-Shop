kind = "web"
previewPath = "/"
title = "AgriMarket"
description = "A production-oriented agricultural marketplace connecting farmers directly with buyers. Browse fresh produce, compare local prices, manage a cart, and explore trusted farm profiles."
version = "1.0.0"
id = "artifacts/agri-market"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19061

[services.development]
run = "pnpm --filter @workspace/agri-market run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/agri-market", "run", "build" ]
serve = "static"
publicDir = "artifacts/agri-market/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19061"
BASE_PATH = "/"
